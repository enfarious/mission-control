<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control — GladOS Oversight System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --panel: #111;
    --border: #1a3a1a;
    --glow: #00ff41;
    --glow-dim: #00aa2a;
    --text: #c0c0c0;
    --text-bright: #e0e0e0;
    --danger: #ff4141;
    --warning: #ffaa00;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header h1 {
    color: var(--glow);
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 10px var(--glow-dim);
  }

  #status {
    font-size: 12px;
    color: var(--glow-dim);
  }

  #status.connected { color: var(--glow); }
  #status.disconnected { color: var(--danger); }

  .container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: calc(100vh - 48px);
    gap: 1px;
    background: var(--border);
  }

  .panel {
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--glow-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .panel-header .count {
    background: var(--border);
    padding: 2px 8px;
    border-radius: 3px;
    color: var(--glow);
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  /* Threat Registry */
  .threat {
    padding: 10px 12px;
    border: 1px solid var(--border);
    margin-bottom: 6px;
    border-radius: 3px;
    transition: border-color 0.3s;
  }

  .threat.new { border-color: var(--glow); animation: flash 1s ease; }
  .threat.critical { border-left: 3px solid var(--danger); }
  .threat.dangerous { border-left: 3px solid var(--warning); }
  .threat.hostile { border-left: 3px solid #ff8800; }
  .threat.noted { border-left: 3px solid var(--glow-dim); }

  .threat-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .threat-wallet {
    color: var(--text-bright);
    font-weight: bold;
    font-size: 13px;
  }

  .threat-level {
    font-size: 11px;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 2px;
  }

  .threat-level.critical { background: var(--danger); color: #000; }
  .threat-level.dangerous { background: var(--warning); color: #000; }
  .threat-level.hostile { background: #ff8800; color: #000; }
  .threat-level.noted { background: var(--glow-dim); color: #000; }

  .threat-meta {
    font-size: 11px;
    color: #666;
  }

  /* Chat Log */
  .chat-entry {
    padding: 6px 10px;
    margin-bottom: 4px;
    border-radius: 3px;
  }

  .chat-entry.glados {
    background: rgba(0, 255, 65, 0.05);
    border-left: 2px solid var(--glow-dim);
  }

  .chat-entry.player {
    background: rgba(255, 255, 255, 0.03);
    border-left: 2px solid #444;
  }

  .chat-entry.system {
    background: rgba(255, 65, 65, 0.05);
    border-left: 2px solid var(--danger);
    font-style: italic;
  }

  .chat-speaker {
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .chat-speaker.glados { color: var(--glow); }
  .chat-speaker.player { color: #888; }
  .chat-speaker.system { color: var(--danger); }

  .chat-text {
    color: var(--text-bright);
    line-height: 1.4;
  }

  /* Chat Input */
  .chat-input-area {
    padding: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }

  .chat-input-area input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-bright);
    padding: 8px 12px;
    font-family: inherit;
    font-size: 13px;
    border-radius: 3px;
    outline: none;
  }

  .chat-input-area input:focus { border-color: var(--glow-dim); }

  .chat-input-area button {
    background: var(--border);
    color: var(--glow);
    border: 1px solid var(--glow-dim);
    padding: 8px 16px;
    font-family: inherit;
    font-size: 12px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
  }

  .chat-input-area button:hover { background: var(--glow-dim); color: #000; }

  @keyframes flash {
    0% { background: rgba(0, 255, 65, 0.15); }
    100% { background: transparent; }
  }

  .panel-body::-webkit-scrollbar { width: 6px; }
  .panel-body::-webkit-scrollbar-track { background: var(--bg); }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .empty-state {
    color: #444;
    text-align: center;
    padding: 40px;
    font-style: italic;
  }
</style>
</head>
<body>
<header>
  <h1>Mission Control</h1>
  <span id="status" class="disconnected">DISCONNECTED</span>
</header>

<div class="container">
  <div class="panel">
    <div class="panel-header">
      Threat Registry
      <span class="count" id="threat-count">0</span>
    </div>
    <div class="panel-body" id="threat-list">
      <div class="empty-state">No threats registered. The facility is... peaceful.</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      Communications Log
      <span class="count" id="chat-count">0</span>
    </div>
    <div class="panel-body" id="chat-log">
      <div class="empty-state">Awaiting communications...</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Speak to GladOS..." autocomplete="off" />
      <button id="chat-send">Transmit</button>
    </div>
  </div>
</div>

<script>
  const threatList = document.getElementById('threat-list');
  const chatLog = document.getElementById('chat-log');
  const chatInput = document.getElementById('chat-input');
  const chatSend = document.getElementById('chat-send');
  const statusEl = document.getElementById('status');
  const threatCount = document.getElementById('threat-count');
  const chatCount = document.getElementById('chat-count');

  let ws;
  let msgCount = 0;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => {
      statusEl.textContent = 'ONLINE';
      statusEl.className = 'connected';
    };

    ws.onclose = () => {
      statusEl.textContent = 'DISCONNECTED';
      statusEl.className = 'disconnected';
      setTimeout(connect, 2000);
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      switch (data.type) {
        case 'init':
          renderThreats(data.threats);
          renderChatHistory(data.chat);
          break;
        case 'threat':
          addThreat(data);
          break;
        case 'chat':
          addChatMessage(data);
          break;
        case 'kill':
          addSystemMessage(`Kill event detected: ${data.wallet || 'unknown'}`);
          break;
      }
    };
  }

  function renderThreats(threats) {
    if (!threats.length) return;
    threatList.innerHTML = '';
    threats.forEach(t => addThreatEl(t, false));
    threatCount.textContent = threats.length;
  }

  function addThreat(data) {
    const existing = threatList.querySelector('.empty-state');
    if (existing) existing.remove();
    // Remove existing entry for this wallet if updating
    const old = threatList.querySelector(`[data-wallet="${data.wallet}"]`);
    if (old) old.remove();
    addThreatEl(data.threat || data, true);
    threatCount.textContent = threatList.children.length;
  }

  function addThreatEl(t, isNew) {
    const div = document.createElement('div');
    div.className = `threat ${t.threat_level}${isNew ? ' new' : ''}`;
    div.dataset.wallet = t.wallet;
    const name = t.nickname ? `"${t.nickname}" (${shorten(t.wallet)})` : shorten(t.wallet);
    div.innerHTML = `
      <div class="threat-header">
        <span class="threat-wallet">${name}</span>
        <span class="threat-level ${t.threat_level}">${t.threat_level}</span>
      </div>
      <div class="threat-meta">
        Incidents: ${t.hit_count} | First: ${ts(t.first_seen)} | Last: ${ts(t.last_seen)}
      </div>
    `;
    threatList.prepend(div);
  }

  function renderChatHistory(messages) {
    if (!messages.length) return;
    chatLog.innerHTML = '';
    messages.forEach(m => addChatEl(m.speaker, m.message));
    msgCount = messages.length;
    chatCount.textContent = msgCount;
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function addChatMessage(data) {
    const existing = chatLog.querySelector('.empty-state');
    if (existing) existing.remove();
    addChatEl(data.speaker, data.message);
    msgCount++;
    chatCount.textContent = msgCount;
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function addSystemMessage(text) {
    const existing = chatLog.querySelector('.empty-state');
    if (existing) existing.remove();
    addChatEl('system', text);
    msgCount++;
    chatCount.textContent = msgCount;
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function addChatEl(speaker, message) {
    const div = document.createElement('div');
    div.className = `chat-entry ${speaker}`;
    const label = speaker === 'glados' ? 'GladOS' : speaker === 'system' ? 'SYSTEM' : 'PILOT';
    div.innerHTML = `
      <div class="chat-speaker ${speaker}">${label}</div>
      <div class="chat-text">${escapeHtml(message)}</div>
    `;
    chatLog.appendChild(div);
  }

  function sendMessage() {
    const msg = chatInput.value.trim();
    if (!msg || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'chat', message: msg }));
    chatInput.value = '';
  }

  chatSend.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  function shorten(w) {
    return w.length > 12 ? w.slice(0, 6) + '...' + w.slice(-4) : w;
  }

  function ts(epoch) {
    if (!epoch) return '?';
    return new Date(epoch * 1000).toLocaleString();
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  connect();
</script>
</body>
</html>
